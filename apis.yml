aid: moonbounce
name: Moonbounce
description: >-
  Moonbounce (formerly Clavata) is a realtime AI control and content-moderation platform.
  Its policy-first engine uses a concise, structured policy syntax to evaluate text and image
  content in real time and enforce an organization's safety policies at scale. The Clavata
  Public API v1 exposes content-evaluation jobs, bulk batch processing (CSV via presigned URL),
  real-time streaming evaluation, completion webhooks, and label evaluation, backed by Python,
  JavaScript/TypeScript, and Go SDKs and bearer-token API keys. Founded by ex-Meta Integrity and
  ex-Apple AI-infrastructure leaders and backed by Amplify Partners.
